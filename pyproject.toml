[project]
name = "zcnn"
version = "0.1.0"
description = "Hardware-aware CIFAR-10 CNN + quantization toolchain for the ztachip FPGA AI accelerator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tensorflow==2.21.*",
  "numpy",
  "matplotlib",
  "scikit-learn",
  "pandas",
  "pillow",
  "streamlit",
  "pytest",
  "fastapi>=0.142",
  "python-multipart>=0.0.32",
  "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zcnn"]

[tool.pytest.ini_options]
testpaths = ["tests", "server"]
